<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merry Christmas</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #0b1220 0%, #05070c 55%, #000 100%);
  }
  canvas {
    display: block;
    border-radius: 2px;
    box-shadow: 0 0 60px rgba(120,170,255,0.12);
  }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
(function () {
  "use strict";

  // ================== 全局参数 ==================
  var W = 1600, H = 900;

  var TREE_POINTS   = 26000;
  var GROUND_POINTS = 2000;
  var STAR_POINTS   = 1000;
  var HEART_POINTS  = 900;

  var TAU = Math.PI * 2;

  var CAM_DIST   = 13.6;
  var CAM_HEIGHT = 6.1;
  var PITCH      = -0.25;
  var TREE_HEIGHT = 12.0;

  var COS_P = Math.cos(PITCH), SIN_P = Math.sin(PITCH);
  var FOCAL = H * 0.63;

  // ================== 随机工具 ==================
  function rand(min, max) { return min + Math.random() * (max - min); }
  function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function gauss(mu, sd) {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }

  // ================== 粒子容器 ==================
  var pos = [], col = [];
  function push(x, y, z, r, g, b) {
    pos.push(x, y, z);
    col.push(clamp(r, 0, 255) | 0, clamp(g, 0, 255) | 0, clamp(b, 0, 255) | 0);
  }

  // ================== 生成圣诞树 ==================
  function genTreePoints() {
    var loops = 9;
    var spiralN = Math.floor(TREE_POINTS * 0.7);

    for (var i = 0; i < spiralN; i++) {
      var u = Math.random();
      var h = Math.pow(u, 1.6);
      var y = TREE_HEIGHT * h + 0.2;

      var baseR = Math.pow(1 - h, 1.1) * 3.2;
      var branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * branchWave;

      var t = u * loops * TAU;
      var angle = t + rand(-0.22, 0.22);
      var r = baseR * rand(0.85, 1.08);

      var x = Math.cos(angle) * r;
      var z = Math.sin(angle) * r;

      var midBoost = Math.max(0.15, 1.0 - Math.abs(h - 0.55) * 1.5);
      var g = 155 + Math.floor(90 * midBoost);
      var b = 185 + Math.floor(70 * midBoost);

      var roll = Math.random();
      if (roll < 0.06) {
        // 暖金色小灯
        push(x, y, z, 255, 232, 178);
      } else if (roll < 0.11) {
        // 冰蓝小灯
        push(x, y, z, 195, 232, 255);
      } else {
        push(x, y, z, 255, clamp(g - 22 + randInt(-12, 16), 130, 240), clamp(b - 6 + randInt(-12, 26), 165, 240));
      }
    }

    var fillN = TREE_POINTS - spiralN;
    for (var j = 0; j < fillN; j++) {
      var hh = Math.pow(Math.random(), 1.9);
      var yy = TREE_HEIGHT * hh + 0.2 + rand(-0.08, 0.08);

      var br = Math.pow(1 - hh, 1.1) * 4.3;
      var bw = Math.max(0, Math.sin((hh * 5.8 + 0.15) * TAU));
      br *= 1.0 + 0.65 * bw;

      var rr = br * Math.sqrt(Math.random());
      var aa = Math.random() * TAU;

      var xx = Math.cos(aa) * rr + rand(-0.08, 0.08);
      var zz = Math.sin(aa) * rr + rand(-0.08, 0.08);

      push(xx, yy, zz, 255, randInt(145, 200), randInt(180, 232));
    }
  }

  // ================== 地面光环 ==================
  function genGroundPoints() {
    var rings = [3.4, 4.2, 5.0, 5.9, 6.8];
    for (var i = 0; i < GROUND_POINTS; i++) {
      var ring = rings[randInt(0, rings.length - 1)];
      var r = gauss(ring, 0.25);
      var theta = Math.random() * TAU;
      var x = Math.cos(theta) * r;
      var z = Math.sin(theta) * r;
      var c = Math.random() < 0.2 ? randInt(200, 230) : randInt(130, 185);
      var warm = Math.random() < 0.3;
      if (warm) push(x, -0.25, z, c, c, Math.min(255, c + 8));
      else push(x, -0.25, z, Math.min(255, c - 75), Math.min(255, c), 235);
    }
  }

  // ================== 空中亮点 ==================
  function genStarPoints() {
    for (var i = 0; i < STAR_POINTS; i++) {
      var x = rand(-19.0, 19.0);
      var z = rand(-19.0, 19.0);
      var y = rand(3.0, 18.0);
      var base = randInt(225, 255);
      push(x, y, z, Math.min(255, base - 40), base, 255);
    }
  }

  // ================== 树顶 3D 爱心 ==================
  function genHeartPoints() {
    var scale = 1.15;
    var topY = TREE_HEIGHT + 0.35;
    var n = 0;
    while (n < HEART_POINTS) {
      var x = rand(-1.3, 1.3);
      var y = rand(-1.4, 1.4);
      var f = Math.pow(x * x + y * y - 1.0, 3) - x * x * (y * y * y);
      if (f <= 0.0) {
        var wx = x * scale * 0.8;
        var wy = topY + (y + 1.0) * scale * 0.5;
        var wz = rand(-0.2, 0.2);

        var dist = Math.hypot(x, y);
        var factor = Math.max(0.4, 1.15 - 0.45 * dist);
        var g = clamp(Math.floor(140 * factor + 95), 130, 255);
        var b = clamp(Math.floor(185 * factor + 85), 130, 255);
        push(wx, wy, wz, 255, g, b);
        n++;
      }
    }
  }

  // ================== 雪花 ==================
  var flakeSprite = null;
  function makeFlakeSprite() {
    var S = 128, cv = document.createElement("canvas");
    cv.width = cv.height = S;
    var g = cv.getContext("2d");
    var grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(0.28, "rgba(240,248,255,0.65)");
    grd.addColorStop(0.6, "rgba(220,238,255,0.16)");
    grd.addColorStop(1, "rgba(220,238,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return cv;
  }

  var flakes = [];
  function spawnFlake(f, initial) {
    f.x = rand(-40, W + 40);
    f.y = initial ? rand(-160, H) : rand(-120, -20);
    f.r = rand(2.5, 9.0);
    f.v = rand(18, 46);
    f.sway = rand(0.4, 1.4);
    f.phase = rand(0, TAU);
    f.alpha = rand(0.35, 0.9);
  }
  function initSnow(n) {
    flakes = [];
    for (var i = 0; i < n; i++) {
      var f = {};
      spawnFlake(f, true);
      flakes.push(f);
    }
  }
  function updateSnow(dt, time) {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.v * dt;
      f.x += Math.sin(time * f.sway + f.phase) * 14 * dt;
      if (f.y > H + 40 || f.x < -60 || f.x > W + 60) spawnFlake(f, false);
    }
  }
  function drawSnow(ctx, time) {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var pulse = 0.75 + 0.25 * Math.sin(time * 1.7 + f.phase);
      ctx.globalAlpha = f.alpha * pulse;
      var d = f.r * 4.2;
      ctx.drawImage(flakeSprite, f.x - d / 2, f.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  // ================== 数据准备 ==================
  genTreePoints();
  genGroundPoints();
  genStarPoints();
  genHeartPoints();
  flakeSprite = makeFlakeSprite();
  initSnow(70);

  var total = pos.length / 3;
  var PX = new Float32Array(total), PY = new Float32Array(total), PZ = new Float32Array(total);
  var CR = new Uint8Array(total), CG = new Uint8Array(total), CB = new Uint8Array(total);
  for (var i = 0, a = 0, b = 0; i < total; i++, a += 3, b += 3) {
    PX[i] = pos[a]; PY[i] = pos[a + 1]; PZ[i] = pos[a + 2];
    CR[i] = col[b]; CG[i] = col[b + 1]; CB[i] = col[b + 2];
  }

  // ================== 画布 ==================
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d", { alpha: false });
  var image = ctx.createImageData(W, H);
  var buf32 = new Uint32Array(image.data.buffer);

  // 辉光用的低分辨率缓冲
  var BW = 400, BH = 225;
  var bloomCanvas = document.createElement("canvas");
  bloomCanvas.width = BW; bloomCanvas.height = BH;
  var bloomCtx = bloomCanvas.getContext("2d");

  var vignette = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.42, W / 2, H * 0.48, H * 1.15);
  vignette.addColorStop(0, "rgba(255,255,255,1)");
  vignette.addColorStop(0.7, "rgba(215,222,240,1)");
  vignette.addColorStop(1, "rgba(80,88,112,1)");

  function fitCanvas() {
    var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();

  // ================== 粒子绘制 ==================
  function drawParticles(cosA, sinA) {
    buf32.fill(0xFF000000);
    var halfW = W / 2, halfH = H / 2;

    for (var i = 0; i < total; i++) {
      var x = PX[i], y = PY[i], z = PZ[i];

      var xz = x * cosA - z * sinA;
      var zz = x * sinA + z * cosA;

      var yp = y * COS_P - zz * SIN_P - CAM_HEIGHT;
      var zp = y * SIN_P + zz * COS_P + CAM_DIST;
      if (zp <= 0.1) continue;

      var f = FOCAL / zp;
      var sx = (halfW + xz * f) | 0;
      var sy = (halfH - yp * f) | 0;
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;

      var size = 3.5 - zp * 0.115;
      var s = size < 1 ? 1 : (size | 0);

      var rgba = 0xFF000000 | (CB[i] << 16) | (CG[i] << 8) | CR[i];
      var x0 = sx - s, x1 = sx + s, y0 = sy - s, y1 = sy + s;
      if (x0 < 0) x0 = 0;
      if (y0 < 0) y0 = 0;
      if (x1 > W - 1) x1 = W - 1;
      if (y1 > H - 1) y1 = H - 1;

      for (var yy = y0; yy <= y1; yy++) {
        var idx = yy * W + x0;
        var end = yy * W + x1;
        while (idx <= end) buf32[idx++] = rgba;
      }
    }

    ctx.putImageData(image, 0, 0);
  }

  function applyBloom() {
    bloomCtx.clearRect(0, 0, BW, BH);
    bloomCtx.filter = "blur(4px)";
    bloomCtx.drawImage(canvas, 0, 0, BW, BH);
    bloomCtx.filter = "none";

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.42;
    ctx.drawImage(bloomCanvas, 0, 0, W, H);
    ctx.restore();
  }

  function applyVignette() {
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ================== 文字 ==================
  function drawTitle() {
    var baseY = Math.floor(H / 3) - 10;
    var grad = ctx.createLinearGradient(0, baseY, 0, baseY + 150);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.75, "#e8f4ff");
    grad.addColorStop(1, "#bcdcff");

    ctx.save();
    ctx.textBaseline = "top";

    // 先画一层大范围柔光
    ctx.font = "italic 70px 'Monotype Corsiva', 'Segoe Script', 'Edwardian Script ITC', cursive";
    ctx.shadowColor = "rgba(170,215,255,0.85)";
    ctx.shadowBlur = 34;
    ctx.fillStyle = "rgba(220,240,255,0.55)";
    ctx.fillText("Merry Christmas", 56, baseY);

    // 主体笔画
    ctx.shadowColor = "rgba(210,235,255,0.9)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = grad;
    ctx.fillText("Merry Christmas", 56, baseY);

    // 名字：中文手写行楷 + 斜切，气质贴近上面的英文手写体
    ctx.font = "italic 52px 'Monotype Corsiva', '华文行楷', 'STXingkai', 'KaiTi', serif";
    ctx.shadowColor = "rgba(180,220,255,0.75)";
    ctx.shadowBlur = 16;
    ctx.save();
    ctx.translate(66, baseY + 108);
    ctx.transform(1, 0, -0.13, 1, 0, 0);
    ctx.fillStyle = "rgba(236,246,255,0.97)";
    ctx.fillText("张钰晗", 0, 0);
    ctx.restore();

    ctx.restore();
  }

  // ================== 主循环 ==================
  var angle = 0.0;
  var last = performance.now();
  var clockT = 0;

  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    clockT += dt;

    updateSnow(dt, clockT);

    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    drawParticles(cosA, sinA);
    applyBloom();
    applyVignette();

    drawTitle();
    drawSnow(ctx, clockT);

    angle += 0.27 * dt;
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
